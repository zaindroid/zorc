# nodes/candidates.yaml -- human-maintained allowlist for propose_node().
#
# Listing a host here authorizes READ-ONLY inspection only. It is NOT
# registration -- propose_node() never writes to registry.yaml, never
# stages anything, never installs anything. Actual fleet membership always
# requires a separate, human-reviewed registry.yaml edit.
#
# ssh_key is relative to the zorc repo root. user defaults to root if
# omitted -- set explicitly for a shared/partial machine where only a
# limited account was granted.

candidates:
  - hostname: rtx5090
    tailscale_ip: 100.124.93.99
    ssh_key: deploy/secrets/rtx5090_deploy_key
    user: zulhaq
    note: >
      Personal workstation, RTX 5090, already running other Docker
      services -- shared/partial node, not fully zorc-owned. Reachable
      over Tailscale only (no public IP); intended for GPU-based apps/APIs,
      exposed via Cloudflare Tunnel if/when needed for AI workflows.

  - hostname: jetson-thor
    tailscale_ip: 100.119.248.100
    ssh_key: deploy/secrets/jetson-thor_deploy_key
    user: zain
    note: >
      NVIDIA Jetson AGX Thor edge device. Reachable over Tailscale only
      (no public IP). SSH connects via Tailscale SSH's own interception
      (same mechanism that blocks root on rtx5090) rather than plain
      authorized_keys -- confirm the actual trust boundary before
      registering anything privileged.

  - hostname: bitbots_gpu
    tailscale_ip: 100.118.75.128
    ssh_key: deploy/secrets/bitbots_gpu_deploy_key
    user: zul2s
    note: >
      Personal AI workstation (bitbots01), dual RTX 3090s, already running
      its own AI services (misotts-voice-agent, sglang-phi4, whisper-asr)
      -- shared/partial node, not fully zorc-owned. Reachable over
      Tailscale only (no public IP); intended for GPU-based AI apps/APIs
      and AI app testing, exposed via Cloudflare Tunnel if/when needed.
