# registry.yaml — single source of truth for what exists on this platform.
#
# Every app MUST have an entry here before it can be deployed.
# CI validates this file and enforces the memory budget on every PR.
#
# Adding an app = a PR against this file. That PR is the approval gate.

# Every node the platform can deploy to. Each app's `target:` below must
# name one of these keys (or the literal "pages" for the static-site edge
# target, which isn't a node at all). Budget is enforced separately PER
# NODE — an app on hostinger-vps has zero effect on servingz's headroom.
#
# `backend` and `is_control_plane` are policy, set by a human here --
# NEVER derived from or overridden by a node's own self-reported
# nodes/<name>.yaml (see monitoring/watchdog.py). A node claiming
# "capabilities: [orchestrator]" about itself must never be sufficient to
# make it control-plane-eligible; self-reported telemetry informs
# placement fitness scoring only, never trust or role.
#   backend: coolify   -> deploy() uses Coolify's API (every node today)
#            zorc-agent -> not yet implemented; reserved for lightweight
#                          devices (RPi/Jetson) that can't run full Coolify
#   is_control_plane: whether shared Postgres/Redis/Traefik and
#            Traefik-fronted apps are allowed on this node
nodes:
  servingz:
    total_memory_mb: 32000
    reserved_mb: 4500        # platform + Postgres + Redis + Traefik + OS
    usable_mb: 27500
    max_utilisation: 0.80    # never allocate beyond 22000 MB
    server_uuid: ynlpfb7qft2ld6a0coagy5nm   # Coolify server UUID ("localhost")
    has_public_ip: false     # home network, reachable only via Cloudflare Tunnel
    provider: self-hosted
    backend: coolify
    is_control_plane: true

  hostinger-vps:
    total_memory_mb: 7800
    reserved_mb: 1350        # Docker + Traefik + OS + dedicated blylinks-crm-postgres
                             # (~43MB observed live, budgeted to 150MB for connection/buffer growth --
                             # this is a per-app dedicated instance, not a shared one like servingz's,
                             # so it isn't tracked in the `infrastructure:` section below)
    usable_mb: 6450
    max_utilisation: 0.80    # never allocate beyond ~5160 MB
    server_uuid: tbzuopqpb0hcwx4uheyxqz1t
    has_public_ip: true      # real public IPv4 -- can take direct ingress
    ip: 2.25.105.110
    tailscale_ip: 100.112.175.41   # used for live cross-node resource checks (deploy/agent.py live_headroom_mb)
    provider: hostinger
    backend: coolify
    is_control_plane: false

domains:
  root: zaindroid.me
  # NOTE: staging_suffix is concatenated as <app>{staging_suffix}.{root},
  # e.g. hello-app + "-staging" + zaindroid.me -> hello-app-staging.zaindroid.me.
  # This is a HYPHEN prefix, not a dot-separated subdomain level like the
  # original template (<app>.staging.example.com) — zaindroid.me's free
  # Cloudflare certificate only covers one wildcard level (*.zaindroid.me),
  # so a third-level staging.zaindroid.me scheme would fail TLS. No staging
  # environment is actually deployed yet; this just reserves the naming
  # convention for when one exists.
  staging_suffix: "-staging"

# ---------------------------------------------------------------------------
# Shared infrastructure. Agents must not modify this block.
# Live on servingz only (see AGENTS.md §2) -- hostinger-vps has no shared
# Postgres/Redis of its own; apps placed there needing either must reach
# servingz's instances over the internet (not the local Docker network),
# or ask before assuming that's acceptable for the workload.
# ---------------------------------------------------------------------------
infrastructure:
  - name: postgres
    memory_mb: 1000
    version: "18"
    note: one database + one role per app, no cross-app access

  - name: redis
    memory_mb: 256
    version: "7"
    note: one logical DB index per app, listed under each app entry

  - name: traefik
    memory_mb: 100
    note: managed by Coolify, routes by hostname

# ---------------------------------------------------------------------------
# Applications. Add new entries at the end. Keep alphabetical within groups.
# ---------------------------------------------------------------------------
apps:
  - name: iht-news-backend
    target: servingz
    memory_mb: 768
    subdomain: iht-search
    database: null
    redis_db: null
    storage_prefix: null
    repo: "github.com/zaindroid/iht_news"
    critical: false
    depends_on: []

  - name: iht-news
    target: servingz
    memory_mb: 768
    subdomain: iht-news
    database: null
    redis_db: null
    storage_prefix: null
    repo: "github.com/zaindroid/iht_news"
    critical: false
    depends_on: []

  - name: hello-app
    target: servingz
    memory_mb: 256
    subdomain: hello
    database: null
    redis_db: null
    storage_prefix: null
    repo: "github.com/zaindroid/hello-app"
    critical: false
    depends_on: []

  - name: zorc-mcp
    target: servingz
    memory_mb: 128
    subdomain: mcp
    database: null
    redis_db: null
    storage_prefix: null
    repo: "github.com/zaindroid/zorc"
    critical: false
    depends_on: []

  - name: blylinks-crm
    target: hostinger-vps
    memory_mb: 384
    # No subdomain -- this app uses a fully custom external domain
    # (portal.blylinks.com, on its own registrar/DNS, not zaindroid.me)
    # instead of the platform's usual {subdomain}.zaindroid.me pattern.
    # Routed via hostinger-vps's direct public-IP ingress (plain A record
    # at 2.25.105.110), not the Cloudflare Tunnel -- blylinks.com's
    # nameservers are Hostinger's, not Cloudflare's.
    subdomain: null
    database: true
    redis_db: null
    storage_prefix: null
    repo: "github.com/zaindroid/blylinks-crm"
    critical: false
    depends_on: []

# ---------------------------------------------------------------------------
# Reserved names — do not allocate these to apps.
# ---------------------------------------------------------------------------
reserved_subdomains:
  - api
  - admin
  - status
  - staging
  - coolify
